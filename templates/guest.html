<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared apps</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: #eef1f5;
      color: #202833;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .guest-panel {
      width: min(100%, 480px);
      background: #ffffff;
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(23, 32, 42, 0.12);
    }
  </style>
</head>
<body>
  <main class="guest-panel">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h1 class="h3 mb-1">Shared apps</h1>
        <p class="small text-secondary mb-0">Signed in as {{ auth_user }}</p>
      </div>
      <form method="post" action="{{ url_for('logout') }}" class="m-0">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Sign out</button>
      </form>
    </div>

    <div class="list-group">
      {% for app_name in apps %}
        <a class="list-group-item list-group-item-action" href="{{ url_for('serve_published_app', project_name=app_name) }}/">{{ app_name }}</a>
      {% else %}
        <div class="text-secondary">No apps have been shared with you.</div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
