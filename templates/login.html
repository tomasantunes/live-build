<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: #eef1f5;
      color: #202833;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-panel {
      width: min(100%, 420px);
      background: #ffffff;
      border: 1px solid #d9e0ea;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(23, 32, 42, 0.12);
    }
  </style>
</head>
<body>
  <main class="login-panel">
    <h1 class="h3 mb-2">Sign in</h1>
    <p class="text-secondary mb-4">Access is restricted to the credentials configured for this app.</p>

    {% if not auth_configured %}
      <div class="alert alert-warning mb-0" role="alert">
        Define <code>AUTH_USER</code> and <code>AUTH_PASSWORD</code> in <code>.env</code> before signing in.
      </div>
    {% else %}
      {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login_submit', next=request.args.get('next', '')) }}">
        <div class="mb-3">
          <label for="username" class="form-label">User</label>
          <input id="username" name="username" class="form-control" type="text" value="{{ username or '' }}" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" class="form-control" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
